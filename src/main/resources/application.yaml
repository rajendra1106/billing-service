spring:
  application:
    name: bayars

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bayars}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false